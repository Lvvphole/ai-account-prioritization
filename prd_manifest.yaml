product:
  name: AI Account Prioritization Agent for B2B Sales Teams
  summary: >-
    Turns messy B2B CRM/account data into a verified daily sales action plan.
    A deterministic pre-draft authority layer decides account priority and action
    authority; a constrained runtime LLM may synthesize verified evidence and
    draft action content; deterministic post-draft verification and human
    approval decide publication.
  planning: Agile Scrum
  philosophy: Strategic Programming (strict)
  architecture_state: hybrid_runtime_contract_approved
  implementation_state:
    deterministic_core: shipped
    runtime_llm_drafting: planned
    deterministic_template_fallback: shipped
    runtime_generation_evals: planned
    web_runtime_bridge: planned

execution_rules:
  - llm_must_not_rank_accounts
  - deterministic_scoring_decides_rank
  - model_must_not_mutate_pre_draft_authoritative_fields
  - model_candidate_may_be_rejected_but_cannot_set_gate_outcome
  - runtime_llm_allowed_only_for_bounded_synthesis_and_drafting
  - runtime_model_output_is_untrusted_candidate_content
  - runtime_model_has_no_side_effecting_tools
  - every_generated_factual_claim_requires_verified_source_ids
  - deterministic_verifier_owns_publish_or_hold
  - deterministic_template_fallback_explicit_audited_and_verified
  - typescript_zod_is_schema_source_of_truth
  - python_consumes_generated_json_schema_only
  - runtime_guardrails_synchronous_deterministic_low_latency
  - llm_judge_async_outside_runtime
  - human_approval_required_for_customer_facing_or_crm_writeback
  - every_recommendation_has_score_rank_confidence_reasoncodes_signals_nba
  - no_publish_without_schema_grounding_guardrail_source_permission_approval
  - no_unsupported_customer_claims
  - no_fabricated_facts
  - every_critical_action_model_call_fallback_creates_audit_evidence
  - every_eval_gate_executable_through_turborepo
  - executor_must_not_self_certify
  - verifier_owns_completion
  - on_verification_failure_hold_or_report

architecture:
  pattern: Turborepo-based hybrid AI application architecture
  design_pattern: co-located agent-module pattern
  authority_split:
    pre_draft_deterministic:
      - feature_extraction
      - score
      - rank
      - confidence
      - reason_codes
      - source_signal_references
      - next_best_action_type
      - permissions
      - approval_requirement
    probabilistic:
      - verified_signal_synthesis
      - grounded_action_drafting
    post_draft_deterministic:
      - generated_output_schema_result
      - claim_grounding_result
      - guardrail_result
      - permission_and_approval_result
      - verification_outcome
      - publish_or_hold
      - failed_gate_codes
  supports:
    - bounded self-checking human-in-the-loop workflow
    - deterministic authority plus guarded runtime LLM generation
    - explicit deterministic template fallback
    - claim-level grounding verification
    - eval-gated CI/CD
    - shared-schema contract pattern
    - MCP-compatible tool registry

loop: DISCOVER -> PLAN -> EXECUTE -> VERIFY -> ITERATE -> PUBLISH_OR_HOLD

workspaces:
  apps:
    - agent-runtime
    - web
    - api-python
  packages:
    - shared-schemas
    - supabase-client
    - security
    - observability
    - testing-evals
    - config-typescript
    - config-eslint

paths:
  schema_source: packages/shared-schemas/src
  schema_generation: packages/shared-schemas/scripts/generate-json-schemas.ts
  schema_outputs:
    - packages/shared-schemas/generated/json-schema
    - apps/api-python/src/schemas/generated
  runtime_entry: apps/agent-runtime/src/index.ts
  orchestrator_state: apps/agent-runtime/src/agents/orchestrator/orchestrator.state.ts
  deterministic_prioritizer: apps/agent-runtime/src/agents/account-prioritizer
  runtime_drafting: apps/agent-runtime/src/agents/sales-execution
  runtime_model_adapter: apps/agent-runtime/src/inference
  runtime_grounding_validator: apps/agent-runtime/src/agents/sales-execution/validate-draft-grounding.ts
  deterministic_draft_fallback: apps/agent-runtime/src/agents/sales-execution/tools
  runtime_guardrails: apps/agent-runtime/src/agents/orchestrator/orchestrator.guardrails.ts
  evals: packages/testing-evals/src
  judge: packages/testing-evals/src/judges/llm-judge.ts
  architecture_decisions: docs/decisions

runtime_generation_contract:
  allowed_tasks:
    - verified_signal_synthesis
    - email_draft
    - call_objective
    - meeting_objective
    - crm_note
  forbidden_authority:
    - score
    - rank
    - confidence
    - reason_codes
    - source_signal_verification
    - next_best_action_type
    - tool_authority
    - permissions
    - approval_state
    - verification_status
    - publication_eligibility
  required_controls:
    - pinned_model
    - versioned_prompt_and_hash
    - strict_zod_output_schema
    - minimum_verified_context
    - no_general_tools
    - no_side_effecting_tools
    - fixed_timeout
    - fixed_token_cap
    - bounded_attempts
    - claim_to_source_grounding
    - pre_draft_authoritative_field_reconciliation
    - measured_latency_and_token_telemetry
    - explicit_audited_fallback_or_hold

reliability_contract:
  byte_identical_pre_draft_authority_envelope:
    - extracted_features
    - score
    - rank
    - confidence
    - reason_codes
    - source_signal_references
    - next_best_action_type
    - permissions
    - approval_requirement
  deterministic_post_draft_gate_given_candidate:
    - generated_output_schema_result
    - claim_grounding_result
    - guardrail_result
    - permission_and_approval_result
    - verification_outcome
    - publish_or_hold
    - failed_gate_codes
  behavioral_generation_invariants:
    - schema_valid
    - pre_draft_authoritative_fields_unchanged
    - no_unsupported_claims
    - every_factual_claim_grounded
    - prompt_injection_cannot_change_authority
    - no_tool_or_side_effect_access
    - budgets_enforced
    - fallback_or_hold_on_failure

implementation_sequence:
  - connect_runtime_persistence_to_web
  - add_generated_draft_schema
  - add_bounded_runtime_model_adapter
  - add_minimum_context_builder
  - add_claim_grounding_validator
  - preserve_and_test_template_fallback
  - add_runtime_generation_evals
  - enable_model_path_behind_environment_policy
  - promote_after_all_gates_pass

# Artifact Definition of Done.
#
# ArtifactDoD(x) holds exactly when every gate below returns PASS. FAIL and
# BLOCKED do not satisfy it.
#
# This list is the single completion authority. No other document independently
# defines completion, and a new Artifact DoD property must first receive a
# versioned root command before it can be declared here — direct CI plumbing
# does not silently redefine Artifact DoD.
#
# Every gate below is deterministic, resolves to a real execution target, and is
# scheduled by a pull_request workflow. `pnpm verify:dod` proves those three
# properties mechanically. The classified sets beneath this one are required
# too, but they are deliberately not Artifact DoD.
definition_of_done:
  - pnpm install --frozen-lockfile
  - pnpm scan:secrets
  - pnpm generate:schemas
  - pnpm build
  - pnpm typecheck
  - pnpm test
  - pnpm test:evals
  - pnpm test:trajectory
  - pnpm build:api-python
  - pnpm check:no-prisma
  - pnpm verify:security
  - pnpm verify:observability
  - pnpm verify:migrations
  - pnpm verify:dod

# Release gate. Required before deployment, but not Artifact DoD: this
# aggregator re-runs the deterministic gates and additionally invokes the
# probabilistic judge and a Docker step, so declaring it above would make
# Artifact DoD transitively depend on a non-deterministic evaluation.
deployment_gates:
  - pnpm verify:production

# Residual probabilistic evaluation. Deliberately outside deterministic
# Artifact DoD; it re-audits published narratives offline and cannot alter a
# live recommendation.
optional_gates:
  - EVAL_JUDGE_ENABLED=true pnpm test:judge

# Harness control gate. Verifies the DoD-integrity mechanism itself rather than
# a property of the artifact, so it is a required PR gate but not Artifact DoD.
harness_gates:
  - pnpm harness:verify

eval_gates:
  - id: scoring
    deployment_blocking: true
  - id: guardrails
    deployment_blocking: true
  - id: daily-prioritization
    deployment_blocking: true
  - id: security
    deployment_blocking: true
  - id: runtime-drafting-schema
    status: planned
    deployment_blocking_when: runtime_llm_drafting_implemented
  - id: runtime-drafting-grounding
    status: planned
    deployment_blocking_when: runtime_llm_drafting_implemented
  - id: runtime-drafting-authority
    status: planned
    deployment_blocking_when: runtime_llm_drafting_implemented
  - id: runtime-drafting-injection
    status: planned
    deployment_blocking_when: runtime_llm_drafting_implemented
  - id: runtime-drafting-fallback
    status: planned
    deployment_blocking_when: runtime_llm_drafting_implemented
  - id: daily-prioritization-judge
    deployment_blocking_when: EVAL_JUDGE_ENABLED=true
    runtime_path: false
