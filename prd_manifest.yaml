product:
  name: AI Account Prioritization for B2B Sales Teams
  summary: >-
    Converts an authoritative daily CRM snapshot into a verified, prioritized,
    human-controllable sales work plan for the correct representative.
  planning: Agile Scrum
  philosophy: Strategic Programming (strict)
  architecture_state: daily_first_bounded_what_how_governing
  completion_state: NOT_DONE
  completion_reason: >-
    The production-shaped daily spine is not complete until real CRM ingestion,
    canonical persistence, daily prioritization, bounded LLM work, durable
    recommendation persistence, the live representative dashboard, protected
    action approval, and durable outcome or feedback capture work end to end.

user_story: >-
  As a sales representative managing more accounts and opportunities than I can
  actively work, I want the application to use authoritative CRM data to show me
  which accounts have controllable leading indicators worth acting on, explain
  the evidence behind each signal, and help me decide the next sales action, so
  I can create more qualified pipeline, advance more opportunities, close more
  business, and generate more revenue without spending my day searching systems.

trust_clause:
  - distinguish_known_facts
  - distinguish_deterministic_derivations
  - distinguish_missing_information
  - distinguish_model_generated_assistance
  - model_assumptions_never_become_customer_or_opportunity_facts

daily_architecture:
  mode: batch_first
  realtime_or_event_driven_required: false
  authoritative_input: daily_crm_snapshot
  canonical_path:
    - authorized_crm_batch
    - validated_canonical_storage
    - deterministic_daily_prioritization
    - bounded_llm_work_when_required
    - deterministic_postcondition_verification
    - durable_recommendation_persistence
    - live_representative_dashboard
    - explicit_human_approval_for_protected_actions
    - durable_outcome_or_feedback

runtime_authority:
  deterministic_software_exclusive:
    - who
    - when
    - where
    - why
    - account_eligibility
    - account_rank
    - permissions
    - resources
    - budgets
    - approval_requirements
    - publication_eligibility
    - side_effect_authority
    - completion_judgment
  llm_bounded:
    - what
    - how
    - evidence_synthesis
    - situation_characterization
    - strict_schema_artifact_generation
    - candidate_action_selection_inside_supplied_action_envelope
    - allowlisted_tool_selection
    - allowlisted_tool_sequencing
    - task_decomposition
    - bounded_subagent_delegation
    - worker_result_synthesis
    - bounded_recovery
  llm_forbidden:
    - rewrite_goal
    - expand_tenant_user_batch_or_account_scope
    - create_tools
    - grant_permissions
    - increase_budgets
    - bypass_required_validation
    - approve_protected_side_effect
    - execute_unapproved_protected_side_effect
    - declare_success

model_policy:
  production_models: 1
  identity: qualified_and_pinned_before_enablement
  supervisor_worker_same_model: true
  model_routing: forbidden_in_current_version
  automatic_model_escalation: forbidden_in_current_version
  role_differentiation:
    - task_contract
    - prompt
    - strict_schema
    - context
    - tool_grant
    - budgets
  invocation_evidence_required:
    - model_identity
    - prompt_identity_and_hash
    - schema_version
    - task_contract_version
    - tool_grant
    - token_and_time_budgets
    - validation_outcome
    - terminal_state

probabilistic_task_contract:
  required_fields:
    - goal
    - authorized_inputs
    - scope
    - allowlisted_tools
    - allowed_action_envelope
    - strict_output_schema
    - deterministic_postconditions
    - budgets
    - human_approval_requirement
    - terminal_states
  terminal_states:
    - PASS
    - FAIL
    - BLOCKED
  child_contract_rule: child_must_be_equal_to_or_narrower_than_parent
  model_completion_claim_has_authority: false
  verifier_authority: deterministic_software_only

budgets:
  externally_owned:
    - input_tokens
    - output_tokens
    - total_run_tokens
    - model_calls
    - tool_calls
    - wall_clock_time
    - retries
    - delegation_depth
    - worker_count
    - concurrency
  model_may_increase_budget: false

human_in_the_loop:
  protected_side_effects:
    - customer_facing_message
    - crm_write
  explicit_approval_of_visible_payload_required: true
  model_can_approve: false
  approval_reuse_for_changed_payload: false

failure_semantics:
  default_scope: item
  usable_items_survive_other_item_failures: true
  full_run_stop_only_for_system_level_invariant_failure: true
  terminal_states:
    PASS: all_required_postconditions_true
    FAIL: one_or_more_required_postconditions_false
    BLOCKED: required_evidence_authority_dependency_or_resource_unavailable

workflow:
  - id: phase_1_load_crm_data
    goal: Create an authorized daily CRM input batch.
    deterministic_owns:
      - uploader_authorization
      - tenant_scope
      - import_type
      - file_and_row_limits
      - batch_identity
      - quarantine_location
      - upload_evidence
    llm_optional:
      - semantic_field_mapping_inside_allowed_schema
    completion: batch_durably_staged_or_explicitly_rejected

  - id: phase_2_validate_and_prepare
    goal: Convert the batch into trusted canonical CRM state.
    deterministic_owns:
      - security_scan
      - bounded_parsing
      - schema_validation
      - canonical_type_conversion
      - tenancy
      - duplicate_handling
      - row_disposition
      - change_set
      - approval_requirements
      - canonical_commit
    llm_optional:
      - ambiguous_text_interpretation
      - bounded_mapping_proposal
      - unstructured_content_extraction
      - finding_explanation
    completion: every_row_has_deterministic_disposition_and_accepted_records_are_committed

  - id: phase_3_prioritize_accounts
    goal: Create the representative's deterministic daily work order.
    deterministic_owns:
      - account_eligibility
      - feature_derivation
      - controllable_leading_indicators
      - priority_score
      - stable_rank
      - evidence_quality_or_confidence_policy
      - reason_codes
      - source_evidence_identifiers
    llm_required: false
    completion: eligible_accounts_have_deterministic_priority_state_and_ranked_book_is_persisted

  - id: phase_4_analyze_and_prepare
    goal: Perform bounded cognitive work for selected recommendations.
    deterministic_owns:
      - account_and_tenant_scope
      - goal
      - verified_evidence_envelope
      - deterministic_reason_codes
      - allowed_action_envelope
      - tool_allowlist
      - strict_output_schema
      - postconditions
      - budgets
      - human_approval_requirement
      - terminal_state
    llm_may:
      - solve_directly
      - synthesize_evidence
      - characterize_sales_situation
      - select_candidate_action_when_contract_permits
      - select_and_sequence_allowlisted_tools
      - produce_structured_action_artifact
      - decompose_task
      - fan_out_bounded_workers
      - synthesize_worker_outputs
      - recover_inside_declared_limits
    subagents:
      enabled_by_contract: true
      same_pinned_model_as_supervisor: true
      child_contract_must_narrow_parent: true
      fanout_required_for_every_task: false
    completion: deterministic_verifier_returns_PASS_FAIL_or_BLOCKED_for_each_item

  - id: phase_5_review_and_take_action
    goal: Let the correct representative inspect and act on usable recommendations.
    deterministic_owns:
      - authentication
      - account_authorization
      - persisted_recommendation_loading
      - evidence_and_terminal_state_display
      - side_effect_permissions
      - approval_binding_to_visible_payload
      - protected_side_effect_result_verification
    llm_may:
      - explain_recommendation
      - answer_bounded_questions
      - revise_action_artifact
      - prepare_call_notes
      - prepare_email
      - prepare_meeting_agenda
      - use_allowlisted_nonprotected_preparatory_tools
    completion: item_reaches_verified_action_terminal_state_or_explicit_FAIL_or_BLOCKED

  - id: phase_6_capture_outcome_and_refresh
    goal: Record what happened and prepare the next daily cycle.
    deterministic_owns:
      - feedback_persistence
      - outcome_persistence
      - provenance
      - product_metric_calculation
      - next_daily_snapshot_boundary
    llm_optional:
      - bounded_offline_feedback_synthesis
      - bounded_offline_feedback_classification
    completion: available_outcome_or_feedback_is_durable_or_unknown_state_is_recorded

completion_contract:
  authority: deterministic_verifier_only
  terminal_states:
    - PASS
    - FAIL
    - BLOCKED

  task_or_phase:
    required_postconditions:
      - software_supplied_goal_satisfied_and_not_rewritten
      - only_authorized_current_scope_inputs_used
      - strict_output_schema_valid
      - required_factual_claims_resolve_to_allowed_source_identifiers
      - deterministic_fields_unchanged
      - tool_calls_allowlisted_with_valid_arguments_and_authorized_resources
      - application_level_postconditions_hold
      - protected_side_effects_have_permission_and_explicit_human_approval
      - token_call_time_retry_delegation_and_concurrency_budgets_respected
      - durable_evidence_exists
      - deterministic_verifier_returns_exactly_one_terminal_state
    model_completion_claim_has_weight: false

  harness_component:
    required_properties:
      - protected_behavior_explicit
      - model_allowed_freedom_explicit
      - boundary_enforced
      - minimum_context_enforced
      - strict_schema_enforced
      - deterministic_postconditions_enforced
      - failure_containment_enforced
      - economic_bounds_enforced
      - relevant_deterministic_regressions_pass
      - external_verifier_returns_PASS
    reliability_improvement_claim_requires_post_change_harness_fitness_measurement: true
    green_ci_alone_proves_reliability_improvement: false

  whole_web_application:
    required_acceptance_path:
      - authorized_crm_batch
      - upload_and_validation_succeed
      - accepted_records_become_canonical_facts
      - daily_prioritization_produces_deterministic_ranks_and_reason_codes
      - phase_4_bounded_llm_work_when_required_satisfies_postconditions
      - verified_recommendations_are_persisted
      - real_recommendations_appear_in_correct_representative_dashboard
      - representative_can_inspect_evidence
      - protected_actions_require_explicit_approval_of_visible_payload
      - outcome_or_feedback_is_durably_recorded
    completion_state_until_path_passes: NOT_DONE

summary_statement_of_completion: >-
  The system is done when an authoritative daily CRM batch can be turned into a
  verified, prioritized, human-controllable sales work plan that is visible and
  actionable in the live web application, and every probabilistic step executes
  inside an explicit deterministic contract that only the harness can mark PASS,
  FAIL, or BLOCKED.

implementation_state:
  deterministic_prioritization_core: shipped
  bounded_single_call_runtime_drafting: shipped
  production_ingestion_commit_spine: incomplete
  durable_runtime_to_web_bridge: incomplete
  live_dashboard_without_mock_recommendations: incomplete
  bounded_supervisor_worker_delegation: incomplete
  production_shaped_daily_spine_acceptance_path: incomplete

repository_verification_commands:
  - pnpm install --frozen-lockfile
  - pnpm scan:secrets
  - pnpm generate:schemas
  - pnpm lint
  - pnpm build
  - pnpm typecheck
  - pnpm test
  - pnpm test:evals
  - pnpm verify:security
  - pnpm verify:observability
  - pnpm verify:production

optional_evaluation_commands:
  - EVAL_JUDGE_ENABLED=true pnpm test:judge

success_metrics:
  commercial_outcomes:
    - qualified_pipeline_creation
    - opportunity_progression
    - closed_won_deals
    - revenue
  completion_gate: false
  causal_attribution_requires_defensible_intervention_design: true

non_goals:
  - realtime_or_event_driven_crm_ingestion_for_current_build
  - general_purpose_autonomous_agent_platform
  - multi_model_routing
  - automatic_model_escalation
  - model_owned_ranking
  - model_owned_eligibility
  - model_owned_permissions
  - model_owned_approval
  - model_owned_publication
  - model_owned_budgets
  - model_owned_side_effect_authority
  - model_owned_completion
