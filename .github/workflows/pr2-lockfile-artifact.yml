name: PR2 Lockfile Artifact

on:
  push:
    branches: ["pr2/vercel-sandbox-runtime-isolation"]

permissions:
  contents: write

concurrency:
  group: pr2-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify patch whitespace
        run: git diff --check -- pnpm-lock.yaml

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate PR2 lockfile"
          git push origin HEAD:pr2/vercel-sandbox-runtime-isolation
