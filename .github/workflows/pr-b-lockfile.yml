name: PR-B Lockfile

on:
  push:
    branches:
      - feat/openai-agents-dormant-adapter
    paths:
      - package.json
      - pnpm-workspace.yaml
      - apps/agent-runtime/package.json
      - packages/openai-agents-bridge/package.json
      - .github/workflows/pr-b-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    name: Generate lockfile artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Write only the generated lockfile to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "feat/openai-agents-dormant-adapter"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml?ref=${GITHUB_REF_NAME}" --jq '.sha')"
          content="$(base64 -w0 pnpm-lock.yaml)"
          jq -n \
            --arg message "chore: regenerate pnpm lockfile for OpenAI Agents SDK" \
            --arg content "$content" \
            --arg sha "$current_sha" \
            --arg branch "$GITHUB_REF_NAME" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            > /tmp/lockfile-update.json
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml" \
            --input /tmp/lockfile-update.json \
            >/dev/null

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-b-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
