name: P4 Qualification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-production-qualification
  cancel-in-progress: false

env:
  P4_QUALIFICATION_SOURCE_SHA: 66554636d6de2f9167ae7611448b3c17a41f542e
  P4_QUALIFICATION_REPORT: p4-output/qualification-${{ github.run_id }}-${{ github.run_attempt }}.json
  P4_PRODUCTION_MODEL_ADMISSION_OUTPUT: p4-output/admission-${{ github.run_id }}-${{ github.run_attempt }}.json
  P4_QUALIFICATION_RELEASE_TAG: p4-qualification-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  qualify:
    name: Live P4 Qualification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.P4_QUALIFICATION_SOURCE_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run canonical P4 qualification
        id: qualification
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: pnpm qualify:models
      - name: Publish immutable qualification evidence
        id: archive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: |
          set -euo pipefail
          test -f "$P4_QUALIFICATION_REPORT"

          assets=("$P4_QUALIFICATION_REPORT")
          if [ -f "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" ]; then
            assets+=("$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT")
          fi

          gh release create "$P4_QUALIFICATION_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$P4_QUALIFICATION_SOURCE_SHA" \
            --title "P4 qualification ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --notes "Decision owner: ${P4_ADMISSION_DECISION_OWNER}\nDecision ref: ${P4_ADMISSION_DECISION_REF}\nQualification source: ${P4_QUALIFICATION_SOURCE_SHA}" \
            --draft
          gh release edit "$P4_QUALIFICATION_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          gh release verify "$P4_QUALIFICATION_RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$P4_QUALIFICATION_RELEASE_TAG" \
            "$P4_QUALIFICATION_REPORT" \
            --repo "$GITHUB_REPOSITORY"
          if [ -f "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" ]; then
            gh release verify-asset "$P4_QUALIFICATION_RELEASE_TAG" \
              "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Upload qualification evidence for temporary workflow access
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4-output/qualification-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
      - name: Upload production admission for temporary workflow access
        if: steps.qualification.outcome == 'success' && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p4-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4-output/admission-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
      - name: Enforce qualification and durable-evidence result
        if: always()
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          test "$ARCHIVE_OUTCOME" = "success"
          test "$QUALIFICATION_OUTCOME" = "success"
