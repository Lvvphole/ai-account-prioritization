name: P4 Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-production-qualification
  cancel-in-progress: false

env:
  P4_QUALIFICATION_SOURCE_SHA: 66554636d6de2f9167ae7611448b3c17a41f542e

jobs:
  qualify:
    name: Live P4 Qualification
    if: github.ref == 'refs/heads/main'
    environment:
      name: p4-production-qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      P4_QUALIFICATION_REPORT: p4-output/qualification-${{ github.run_id }}-${{ github.run_attempt }}.json
      P4_PRODUCTION_MODEL_ADMISSION_OUTPUT: p4-output/admission-${{ github.run_id }}-${{ github.run_attempt }}.json
      P4_QUALIFICATION_RELEASE_TAG: p4-qualification-${{ github.run_id }}-${{ github.run_attempt }}
      P4_TRANSFER_ARTIFACT: p4-qualification-transfer-${{ github.run_id }}-${{ github.run_attempt }}
      P4_TERMINAL_EVIDENCE: p4-output/terminal-${{ github.run_id }}-${{ github.run_attempt }}.txt
      P4_INVOCATION_AUDIT: p4-output/invocations-${{ github.run_id }}-${{ github.run_attempt }}.ndjson
      P4_COMMAND_STATUS: p4-output/command-status-${{ github.run_id }}-${{ github.run_attempt }}.txt
    steps:
      - name: Verify immutable releases are enabled
        env:
          GH_TOKEN: ${{ secrets.P4_REPOSITORY_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          immutable_enabled="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          test "$immutable_enabled" = "true"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.P4_QUALIFICATION_SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run canonical P4 qualification
        id: qualification
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.P4_ANTHROPIC_API_KEY }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: |
          set -uo pipefail
          mkdir -p p4-output
          audit_preload="$RUNNER_TEMP/p4-invocation-audit.cjs"
          stderr_file="$RUNNER_TEMP/p4-qualification.stderr"
          cat > "$audit_preload" <<'EOF'
          const { createHash } = require("node:crypto");
          const { appendFileSync } = require("node:fs");
          const path = process.env.P4_INVOCATION_AUDIT;
          const originalFetch = globalThis.fetch?.bind(globalThis);
          const providers = {
            "api.anthropic.com": "anthropic",
            "api.openai.com": "openai",
            "api.x.ai": "xai",
            "generativelanguage.googleapis.com": "google",
          };
          let sequence = 0;
          const hash = (value) => createHash("sha256").update(value).digest("hex");
          const record = (event) => {
            if (!path) throw new Error("P4_INVOCATION_AUDIT is required before provider invocation.");
            appendFileSync(path, `${JSON.stringify(event)}\n`, "utf8");
          };
          if (originalFetch) {
            globalThis.fetch = async (input, init = {}) => {
              const url = new URL(typeof input === "string" || input instanceof URL ? input : input.url);
              const provider = providers[url.hostname];
              if (!provider) return originalFetch(input, init);
              const body = typeof init.body === "string" ? init.body : "";
              let model = null;
              try { model = JSON.parse(body).model ?? null; } catch {}
              const n = ++sequence;
              const started = Date.now();
              record({ kind: "p4-provider-invocation-v1", phase: "started", sequence: n,
                timestamp: new Date().toISOString(), provider, model,
                requestBodySha256: body ? hash(body) : null });
              try {
                const response = await originalFetch(input, init);
                record({ kind: "p4-provider-invocation-v1", phase: "completed", sequence: n,
                  timestamp: new Date().toISOString(), provider, model,
                  outcome: "http_response", httpStatus: response.status,
                  durationMs: Date.now() - started });
                return response;
              } catch (error) {
                record({ kind: "p4-provider-invocation-v1", phase: "completed", sequence: n,
                  timestamp: new Date().toISOString(), provider, model,
                  outcome: "network_error", errorName: error?.name ?? "UnknownError",
                  durationMs: Date.now() - started });
                throw error;
              }
            };
          }
          EOF

          : > "$stderr_file"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          NODE_OPTIONS="--require=${audit_preload}" pnpm qualify:models \
            2> >(tee "$stderr_file" >&2)
          exit_code=$?
          set -e
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          failure_reason_code="NONE"
          failure_message_sha256="NONE"
          if [ "$exit_code" -ne 0 ]; then
            failure_reason_code="$(
              grep -Eo '(QUALIFICATION_[A-Z0-9_]+|DRAFT_MODEL_[A-Z0-9_]+|MISSING_CREDENTIAL)' \
                "$stderr_file" | tail -n 1 || true
            )"
            test -n "$failure_reason_code" || failure_reason_code="UNCLASSIFIED_COMMAND_FAILURE"
            failure_message_sha256="$(sha256sum "$stderr_file" | awk '{print $1}')"
          fi
          cat > "$P4_COMMAND_STATUS" <<EOF
          started_at=${started_at}
          completed_at=${completed_at}
          exit_code=${exit_code}
          failure_reason_code=${failure_reason_code}
          failure_message_sha256=${failure_message_sha256}
          EOF
          exit "$exit_code"
      - name: Record terminal qualification evidence
        if: always()
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: |
          set -euo pipefail
          mkdir -p p4-output
          qualification_outcome="${QUALIFICATION_OUTCOME:-failure}"
          case "$qualification_outcome" in
            success|failure|cancelled|skipped) ;;
            *) qualification_outcome="failure" ;;
          esac
          printf '%s\n' "$qualification_outcome" > p4-output/qualification-outcome.txt

          qualification_report_present=false
          [ ! -f "$P4_QUALIFICATION_REPORT" ] || qualification_report_present=true
          invocation_started_count=0
          [ ! -s "$P4_INVOCATION_AUDIT" ] || \
            invocation_started_count="$(grep -c '"phase":"started"' "$P4_INVOCATION_AUDIT" || true)"
          if [ ! -f "$P4_COMMAND_STATUS" ]; then
            cat > "$P4_COMMAND_STATUS" <<EOF
          started_at=unknown
          completed_at=unknown
          exit_code=unknown
          failure_reason_code=COMMAND_STATUS_MISSING
          failure_message_sha256=NONE
          EOF
          fi
          policy_file_sha256="missing"
          [ ! -f config/p4-qualification-policy.json ] || \
            policy_file_sha256="$(sha256sum config/p4-qualification-policy.json | awk '{print $1}')"

          if [ "$qualification_outcome" = "success" ]; then
            test "$qualification_report_present" = "true"
            test "$invocation_started_count" -gt 0
          fi

          cat > "$P4_TERMINAL_EVIDENCE" <<EOF
          kind=p4-qualification-terminal-evidence-v2
          workflow_run_id=${GITHUB_RUN_ID}
          producer_run_attempt=${GITHUB_RUN_ATTEMPT}
          qualification_source_sha=${P4_QUALIFICATION_SOURCE_SHA}
          qualification_policy_file_sha256=${policy_file_sha256}
          decision_owner=${P4_ADMISSION_DECISION_OWNER}
          decision_ref=${P4_ADMISSION_DECISION_REF}
          qualification_outcome=${qualification_outcome}
          qualification_report_present=${qualification_report_present}
          invocation_started_count=${invocation_started_count}
          EOF
          cat "$P4_COMMAND_STATUS" >> "$P4_TERMINAL_EVIDENCE"

          printf '%s\n' \
            "$P4_QUALIFICATION_REPORT" \
            "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" \
            "$P4_TERMINAL_EVIDENCE" \
            "$P4_INVOCATION_AUDIT" \
            "$P4_QUALIFICATION_RELEASE_TAG" \
            "$P4_TRANSFER_ARTIFACT" \
            "$GITHUB_RUN_ATTEMPT" \
            > p4-output/evidence-identity.txt
      - name: Transfer qualification evidence to archive job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.P4_TRANSFER_ARTIFACT }}
          path: p4-output/
          if-no-files-found: error
          retention-days: 1

  archive:
    name: Archive P4 Qualification Evidence
    if: always() && needs.qualify.result == 'success'
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed only to create and publish the immutable evidence release.
      actions: read # Needed only to read this run's bounded transfer artifact.
    steps:
      - name: Download, publish, and verify immutable qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: |
          set -euo pipefail
          mkdir -p p4-output
          artifact_prefix="p4-qualification-transfer-${GITHUB_RUN_ID}-"
          transfer_artifact="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select((.expired == false) and (.name | startswith(\"${artifact_prefix}\")))] | sort_by(.created_at) | last | .name"
          )"
          test -n "$transfer_artifact"
          test "$transfer_artifact" != "null"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$transfer_artifact" \
            --dir p4-output

          test -f p4-output/evidence-identity.txt
          mapfile -t evidence_identity < p4-output/evidence-identity.txt
          test "${#evidence_identity[@]}" -eq 7
          P4_QUALIFICATION_REPORT="${evidence_identity[0]}"
          P4_PRODUCTION_MODEL_ADMISSION_OUTPUT="${evidence_identity[1]}"
          P4_TERMINAL_EVIDENCE="${evidence_identity[2]}"
          P4_INVOCATION_AUDIT="${evidence_identity[3]}"
          P4_QUALIFICATION_RELEASE_TAG="${evidence_identity[4]}"
          P4_TRANSFER_ARTIFACT="${evidence_identity[5]}"
          P4_PRODUCER_RUN_ATTEMPT="${evidence_identity[6]}"

          test "$P4_TRANSFER_ARTIFACT" = "$transfer_artifact"
          test -f p4-output/qualification-outcome.txt
          test -f "$P4_TERMINAL_EVIDENCE"
          qualification_outcome="$(cat p4-output/qualification-outcome.txt)"

          assets=("$P4_TERMINAL_EVIDENCE")
          [ ! -s "$P4_INVOCATION_AUDIT" ] || assets+=("$P4_INVOCATION_AUDIT")
          if [ -f "$P4_QUALIFICATION_REPORT" ]; then
            assets+=("$P4_QUALIFICATION_REPORT")
          else
            test "$qualification_outcome" != "success"
          fi
          if [ "$qualification_outcome" = "success" ] && [ -f "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" ]; then
            assets+=("$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT")
          fi

          release_state=""
          if release_state="$(
            gh release view "$P4_QUALIFICATION_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isImmutable,targetCommitish \
              --jq '[.isDraft, .isImmutable, .targetCommitish] | @tsv' \
              2>/dev/null
          )"; then
            read -r release_is_draft release_is_immutable release_target <<< "$release_state"
            test "$release_target" = "$P4_QUALIFICATION_SOURCE_SHA"
          else
            gh release create "$P4_QUALIFICATION_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$P4_QUALIFICATION_SOURCE_SHA" \
              --title "P4 qualification ${GITHUB_RUN_ID}/${P4_PRODUCER_RUN_ATTEMPT}" \
              --notes "Decision owner: ${P4_ADMISSION_DECISION_OWNER}\nDecision ref: ${P4_ADMISSION_DECISION_REF}\nQualification source: ${P4_QUALIFICATION_SOURCE_SHA}\nProducer attempt: ${P4_PRODUCER_RUN_ATTEMPT}" \
              --draft
            release_is_draft=true
            release_is_immutable=false
          fi

          if [ "$release_is_draft" = "true" ]; then
            gh release upload "$P4_QUALIFICATION_RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$P4_QUALIFICATION_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
          else
            test "$release_is_immutable" = "true"
          fi

          gh release verify "$P4_QUALIFICATION_RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$P4_QUALIFICATION_RELEASE_TAG" \
            "$P4_TERMINAL_EVIDENCE" --repo "$GITHUB_REPOSITORY"
          if [ -s "$P4_INVOCATION_AUDIT" ]; then
            gh release verify-asset "$P4_QUALIFICATION_RELEASE_TAG" \
              "$P4_INVOCATION_AUDIT" --repo "$GITHUB_REPOSITORY"
          fi
          if [ -f "$P4_QUALIFICATION_REPORT" ]; then
            gh release verify-asset "$P4_QUALIFICATION_RELEASE_TAG" \
              "$P4_QUALIFICATION_REPORT" --repo "$GITHUB_REPOSITORY"
          fi
          if [ "$qualification_outcome" = "success" ] && [ -f "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" ]; then
            gh release verify-asset "$P4_QUALIFICATION_RELEASE_TAG" \
              "$P4_PRODUCTION_MODEL_ADMISSION_OUTPUT" --repo "$GITHUB_REPOSITORY"
          fi
          test "$qualification_outcome" = "success"
