name: P4 Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-production-qualification
  cancel-in-progress: false

env:
  P4_QUALIFICATION_SOURCE_SHA: 66554636d6de2f9167ae7611448b3c17a41f542e

jobs:
  qualify:
    name: Live P4 Qualification
    if: github.ref == 'refs/heads/main'
    environment:
      name: p4-production-qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      P4_TRANSFER_ARTIFACT: p4-qualification-transfer-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify immutable releases are enabled
        env:
          GH_TOKEN: ${{ secrets.P4_REPOSITORY_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          immutable_enabled="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          test "$immutable_enabled" = "true"

      - name: Checkout reviewed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .p4-control
          persist-credentials: false

      - name: Checkout decision-authorized qualification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.P4_QUALIFICATION_SOURCE_SHA }}
          path: .p4-source
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: .p4-source/pnpm-lock.yaml

      - name: Install qualification dependencies
        working-directory: .p4-source
        run: pnpm install --frozen-lockfile

      - name: Run canonical P4 qualification with evidence contract
        id: qualification
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.P4_ANTHROPIC_API_KEY }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: >-
          node "$GITHUB_WORKSPACE/.p4-control/scripts/p4-qualification-evidence.mjs"
          run --source-dir "$GITHUB_WORKSPACE/.p4-source"

      - name: Transfer qualification evidence to archive job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.P4_TRANSFER_ARTIFACT }}
          path: .p4-source/p4-output/
          if-no-files-found: error
          retention-days: 1

  archive:
    name: Archive P4 Qualification Evidence
    if: always() && needs.qualify.result == 'success'
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed only to create and publish the immutable evidence release.
      actions: read # Needed only to read this run's bounded transfer artifact.
    steps:
      - name: Publish verified P4 evidence contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p p4-output
          artifact_prefix="p4-qualification-transfer-${GITHUB_RUN_ID}-"
          transfer_artifact="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select((.expired == false) and (.name | startswith(\"${artifact_prefix}\")))] | sort_by(.created_at) | last | .name"
          )"
          test -n "$transfer_artifact"
          test "$transfer_artifact" != "null"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$transfer_artifact" \
            --dir p4-output

          manifest="p4-output/evidence-manifest.json"
          test -f "$manifest"
          jq -e '.contractVersion == "p4-qualification-evidence-v1"' "$manifest" >/dev/null

          producer_run_id="$(jq -er '.workflow.runId' "$manifest")"
          producer_attempt="$(jq -er '.workflow.producerRunAttempt' "$manifest")"
          source_sha="$(jq -er '.workflow.qualificationSourceSha' "$manifest")"
          release_tag="$(jq -er '.release.tag' "$manifest")"
          recorded_transfer="$(jq -er '.release.transferArtifact' "$manifest")"
          decision_owner="$(jq -er '.decision.owner' "$manifest")"
          decision_ref="$(jq -er '.decision.ref' "$manifest")"
          qualification_outcome="$(jq -er '.qualification.outcome' "$manifest")"

          test "$producer_run_id" = "$GITHUB_RUN_ID"
          test "$source_sha" = "$P4_QUALIFICATION_SOURCE_SHA"
          test "$recorded_transfer" = "$transfer_artifact"
          test "$release_tag" = "p4-qualification-${GITHUB_RUN_ID}-${producer_attempt}"

          verify_asset_hash() {
            local asset_path="$1"
            local expected_hash="$2"
            case "$asset_path" in
              p4-output/*) ;;
              *) return 1 ;;
            esac
            test -f "$asset_path"
            test "$(sha256sum "$asset_path" | awk '{print $1}')" = "$expected_hash"
          }

          report_present="$(jq -r '.artifacts.report.present' "$manifest")"
          admission_present="$(jq -r '.artifacts.admission.present' "$manifest")"
          admission_publish="$(jq -r '.artifacts.admission.publishEligible' "$manifest")"
          invocation_present="$(jq -r '.invocations.present' "$manifest")"
          assets=("$manifest")

          if [ "$invocation_present" = "true" ]; then
            invocation_path="$(jq -er '.invocations.path' "$manifest")"
            invocation_hash="$(jq -er '.invocations.sha256' "$manifest")"
            verify_asset_hash "$invocation_path" "$invocation_hash"
            assets+=("$invocation_path")
          fi
          if [ "$report_present" = "true" ]; then
            report_path="$(jq -er '.artifacts.report.path' "$manifest")"
            report_hash="$(jq -er '.artifacts.report.sha256' "$manifest")"
            verify_asset_hash "$report_path" "$report_hash"
            assets+=("$report_path")
          else
            test "$qualification_outcome" != "success"
          fi
          if [ "$admission_publish" = "true" ]; then
            test "$qualification_outcome" = "success"
            test "$admission_present" = "true"
            admission_path="$(jq -er '.artifacts.admission.path' "$manifest")"
            admission_hash="$(jq -er '.artifacts.admission.sha256' "$manifest")"
            verify_asset_hash "$admission_path" "$admission_hash"
            assets+=("$admission_path")
          else
            test "$qualification_outcome" != "success"
          fi

          release_state=""
          if release_state="$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isImmutable,targetCommitish \
              --jq '[.isDraft, .isImmutable, .targetCommitish] | @tsv' \
              2>/dev/null
          )"; then
            read -r release_is_draft release_is_immutable release_target <<< "$release_state"
            test "$release_target" = "$P4_QUALIFICATION_SOURCE_SHA"
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$P4_QUALIFICATION_SOURCE_SHA" \
              --title "P4 qualification ${GITHUB_RUN_ID}/${producer_attempt}" \
              --notes "Decision owner: ${decision_owner}\nDecision ref: ${decision_ref}\nQualification source: ${P4_QUALIFICATION_SOURCE_SHA}\nProducer attempt: ${producer_attempt}" \
              --draft
            release_is_draft=true
            release_is_immutable=false
          fi

          if [ "$release_is_draft" = "true" ]; then
            gh release upload "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            test "$release_is_immutable" = "true"
          fi

          gh release verify "$release_tag" --repo "$GITHUB_REPOSITORY"
          for asset in "${assets[@]}"; do
            gh release verify-asset "$release_tag" "$asset" --repo "$GITHUB_REPOSITORY"
          done
          test "$qualification_outcome" = "success"
