name: P4 Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-production-qualification
  cancel-in-progress: false

env:
  P4_QUALIFICATION_SOURCE_SHA: 66554636d6de2f9167ae7611448b3c17a41f542e

jobs:
  qualify:
    name: Live P4 Qualification
    if: github.ref == 'refs/heads/main'
    environment:
      name: p4-production-qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      P4_TRANSFER_ARTIFACT: p4-qualification-transfer-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify immutable releases are enabled
        env:
          GH_TOKEN: ${{ secrets.P4_REPOSITORY_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          immutable_enabled="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          test "$immutable_enabled" = "true"

      - name: Checkout reviewed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .p4-control
          persist-credentials: false

      - name: Checkout decision-authorized qualification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.P4_QUALIFICATION_SOURCE_SHA }}
          path: .p4-source
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: .p4-source/pnpm-lock.yaml

      - name: Install qualification dependencies
        working-directory: .p4-source
        run: pnpm install --frozen-lockfile

      - name: Run canonical P4 qualification with evidence contract
        id: qualification
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.P4_ANTHROPIC_API_KEY }}
          P4_ADMISSION_DECISION_OWNER: ${{ vars.P4_ADMISSION_DECISION_OWNER }}
          P4_ADMISSION_DECISION_REF: ${{ vars.P4_ADMISSION_DECISION_REF }}
        run: >-
          node "$GITHUB_WORKSPACE/.p4-control/scripts/p4-qualification-evidence.mjs"
          run --source-dir "$GITHUB_WORKSPACE/.p4-source"

      - name: Transfer qualification evidence to archive job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.P4_TRANSFER_ARTIFACT }}
          path: .p4-source/p4-output/
          if-no-files-found: error
          retention-days: 1

  archive:
    name: Archive P4 Qualification Evidence
    if: always() && needs.qualify.result == 'success'
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write # The pinned first-party publisher is the only write-authorized code.
      actions: read # Needed only to read this run's bounded transfer artifact.
    steps:
      - name: Publish verified P4 evidence contract
        uses: Lvvphole/ai-account-prioritization/.github/actions/p4-publish@bada759852a9e1058c37aaa2d3e6377428ed9d4d
        with:
          qualification-source-sha: ${{ env.P4_QUALIFICATION_SOURCE_SHA }}
