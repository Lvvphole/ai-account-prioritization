name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck & Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 1: schema generation (TS/Zod -> JSON Schema for Python)
      - name: Generate schemas
        run: pnpm generate:schemas

      - name: Fail if generated schemas drifted
        run: git diff --exit-code -- packages/shared-schemas/generated apps/api-python/src/schemas/generated

      # Gate 2: build everything through Turbo
      - name: Build
        run: pnpm build

      # Gate 3: typecheck everything through Turbo
      - name: Typecheck
        run: pnpm typecheck

      # Gate 4: deterministic evals (runtime path)
      - name: Run evals
        run: pnpm test:evals

      # Python support service syntax/build check
      - name: Build Python support service
        run: pnpm build:api-python

      # Guard: Prisma is deferred (Execution Rule #28)
      - name: Check no Prisma
        run: pnpm check:no-prisma

      # Gate 5: Acceptance A forces runtime drafting off, executes the real
      # deterministic daily runtime, then invokes the migration verifier and its
      # durable continuity suite across persistence, RLS read, approval,
      # protected execution, and follow-up capture.
      - name: Acceptance A — deterministic baseline
        run: pnpm test:acceptance:a

      # Gate 6: containerization — validate Compose (config needs no daemon)
      - name: Validate Docker Compose
        run: docker compose -f infra/compose.yaml config

      # Gate 7: build all images (daemon available on GitHub runners)
      - name: Build Docker images
        run: docker compose -f infra/compose.yaml build
