name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck & Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Gate 0: fail-closed coding-agent change budget and PR repair circuit breaker.
      # Runs before dependency installation so violations fail early and cheaply.
      - name: Verify coding-agent contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-agent-contract.mjs

      - name: Test coding-agent contract
        run: node --test scripts/verify-agent-contract.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 1: schema generation (TS/Zod -> JSON Schema for Python)
      - name: Generate schemas
        run: pnpm generate:schemas

      - name: Fail if generated schemas drifted
        run: git diff --exit-code -- packages/shared-schemas/generated apps/api-python/src/schemas/generated

      # Gate 2: build everything through Turbo
      - name: Build
        run: pnpm build

      # Gate 3: typecheck everything through Turbo
      - name: Typecheck
        run: pnpm typecheck

      # Gate 4: deterministic evals (runtime path)
      - name: Run evals
        run: pnpm test:evals

      # Python support service syntax/build check
      - name: Build Python support service
        run: pnpm build:api-python

      # Guard: Prisma is deferred (Execution Rule #28)
      - name: Check no Prisma
        run: pnpm check:no-prisma

      # Gate 5: the schema enforces its invariants, not just its shape. Applies
      # every migration to an empty database and asserts the behaviour: a batch
      # cannot skip approval, an unauthenticated connection cannot record one,
      # a hard block cannot be resolved, RLS holds per role.
      - name: Verify migrations
        run: pnpm verify:migrations

      # Gate 6: containerization — validate Compose (config needs no daemon)
      - name: Validate Docker Compose
        run: docker compose -f infra/compose.yaml config

      # Gate 7: build all images (daemon available on GitHub runners)
      - name: Build Docker images
        run: docker compose -f infra/compose.yaml build
