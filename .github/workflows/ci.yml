name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck & Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 1: schema generation (TS/Zod -> JSON Schema for Python)
      - name: Generate schemas
        run: pnpm generate:schemas

      - name: Fail if generated schemas drifted
        run: git diff --exit-code -- packages/shared-schemas/generated apps/api-python/src/schemas/generated

      # Gate 2: build everything through Turbo
      - name: Build
        run: pnpm build

      # Gate 3: typecheck everything through Turbo
      - name: Typecheck
        run: pnpm typecheck

      # Gate 4: deterministic evals (runtime path)
      - name: Run evals
        run: pnpm test:evals

      # Gate 4b: package-level unit tests. Declared in definition_of_done, so
      # it has to be scheduled here — a declared gate that no pull_request
      # workflow runs is a claim, not a gate.
      - name: Run unit tests
        run: pnpm test

      # Python support service syntax/build check
      - name: Build Python support service
        run: pnpm build:api-python

      # Guard: Prisma is deferred (Execution Rule #28)
      - name: Check no Prisma
        run: pnpm check:no-prisma

      # Gate 5: the schema enforces its invariants, not just its shape. Applies
      # every migration to an empty database and asserts the behaviour: a batch
      # cannot skip approval, an unauthenticated connection cannot record one,
      # a hard block cannot be resolved, RLS holds per role.
      - name: Verify migrations
        run: pnpm verify:migrations

      # Gate 6: the declared Definition of Done is honest — every gate in
      # prd_manifest.yaml resolves, has a real execution target, and is
      # scheduled by a pull_request workflow, and no second document
      # independently defines completion.
      - name: Verify Definition of Done integrity
        run: pnpm verify:dod

      # Harness control gate. Verifies the checker itself, so it is required on
      # every PR but is deliberately not an Artifact DoD gate — it proves a
      # property of the mechanism, not of the artifact.
      - name: Verify the DoD checker
        run: pnpm harness:verify

      # Gate 7: containerization — validate Compose (config needs no daemon)
      - name: Validate Docker Compose
        run: docker compose -f infra/compose.yaml config

      # Gate 7: build all images (daemon available on GitHub runners)
      - name: Build Docker images
        run: docker compose -f infra/compose.yaml build
