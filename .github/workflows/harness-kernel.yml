name: Harness Kernel

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: harness-kernel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: Harness Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify affected repository contracts
        env:
          HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          pnpm harness:verify
          --base "$HARNESS_BASE_SHA"
          --head "$HARNESS_HEAD_SHA"
          --evidence verification-reports/harness-evidence.json

      - name: Preserve harness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-evidence
          path: verification-reports/harness-evidence.json
          if-no-files-found: warn
