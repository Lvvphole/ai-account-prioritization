name: PR2 Sync Sandbox Documentation

on:
  push:
    branches: ["pr2/vercel-sandbox-runtime-isolation"]

permissions:
  contents: write

concurrency:
  group: pr2-sync-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply canonical PR2 documentation changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"anchor mismatch in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          agents_anchor = '''Generated prose is not assumed to be bit-identical.\n\n## 5. Environment boundaries'''
          agents_insert = '''Generated prose is not assumed to be bit-identical.\n\n### 4.3 Current production sandbox boundary\n\nEvery enabled production runtime-model invocation must use the admitted sandbox\nexecution profile. The current Anthropic profile is\n`vercel-sandbox-anthropic-egress-v1`.\n\nFor the hosted Anthropic API, the Vercel Sandbox isolates the local provider\nrequest and response relay and the provider egress surface. Anthropic inference\nremains hosted by Anthropic. Do not claim that remote provider inference runs\ninside the local Vercel microVM.\n\nThe current sandbox contract is fail-closed:\n\n- the sandbox is ephemeral and non-persistent;\n- it receives no host environment and exposes no ports;\n- provider egress is limited to `POST https://api.anthropic.com/v1/messages`;\n- the real Anthropic credential is not written into the sandbox file system or\n  command environment;\n- the sandbox receives a placeholder credential and the trusted Vercel network\n  policy injects the real credential only at the egress boundary;\n- the production provider registry has no direct-host Anthropic fallback;\n- sandbox creation, command execution, response transfer, and cleanup remain\n  inside the externally enforced runtime deadline; and\n- sandbox failure uses only the existing deterministic template fallback or hold.\n\nDurable pre-invocation evidence records the non-secret `executionProfileId` for\nthe built-in production model client. An injected test or custom model client must\nnot be falsely recorded as sandboxed.\n\nThis boundary does not authorize general model tool use, model-selected actions,\nsubagents, routing, voting, or any other deferred Position B capability.\n\n## 5. Environment boundaries'''
          replace_once("AGENTS.md", agents_anchor, agents_insert)

          arch_anchor = '''These capabilities remain approved under the target architecture. A later implementation requires a new explicit ruling and the applicable ADR-002 admission evidence.\n\n### P4 production acceptance profiles'''
          arch_insert = '''These capabilities remain approved under the target architecture. A later implementation requires a new explicit ruling and the applicable ADR-002 admission evidence.\n\n### Current production sandbox execution boundary\n\nEvery enabled production model call uses an admitted sandbox execution profile.\nThe current Anthropic profile is `vercel-sandbox-anthropic-egress-v1`.\n\n```text\ntrusted deterministic harness\n  -> RuntimeModelClient\n  -> sandboxed Anthropic adapter\n  -> official Anthropic SDK\n  -> sandbox-backed provider relay\n  -> ephemeral Vercel Sandbox\n  -> exact Anthropic Messages API egress\n  -> Anthropic-hosted inference\n  -> untrusted response\n  -> existing deterministic verification and publication gates\n```\n\nThe Vercel microVM isolates the local request and response relay and provider\negress surface. Anthropic hosts the remote inference process. The architecture\ndoes not claim that Anthropic inference runs inside the local microVM.\n\nThe sandbox receives no host environment, exposes no ports, and is non-persistent.\nIts network policy permits only `POST /v1/messages` to `api.anthropic.com`. The\nreal provider credential stays outside the VM and is injected at the trusted\nnetwork-policy boundary. There is no direct-host provider fallback. Sandbox\nfailure therefore enters the existing deterministic template fallback or hold\npath.\n\nThe durable pre-invocation audit evidence records the non-secret execution\nprofile identity for the built-in production model client. This isolation\nboundary does not implement tools, subagents, routing, candidate-action selection,\nor another deferred Position B capability.\n\n### P4 production acceptance profiles'''
          replace_once("docs/ARCHITECTURE.md", arch_anchor, arch_insert)

          context_anchor = '''A deferred capability requires a new explicit ruling and the applicable ADR-002\nadmission evidence before implementation.\n\n## Sprint history and next delivery path'''
          context_insert = '''A deferred capability requires a new explicit ruling and the applicable ADR-002\nadmission evidence before implementation.\n\n### Current model execution isolation\n\nWhen the current production model path is enabled, the built-in Anthropic client\nuses the admitted `vercel-sandbox-anthropic-egress-v1` execution profile. The\nVercel Sandbox contains only the local provider relay. Anthropic still hosts the\nremote inference process.\n\nThe VM is ephemeral, receives no host environment, exposes no ports, and can\nreach only the exact admitted Anthropic Messages endpoint. The real provider\ncredential stays outside the VM and is injected at the trusted egress boundary.\nThere is no unsandboxed production fallback. A sandbox failure therefore uses the\nexisting deterministic template fallback or hold.\n\nDurable pre-invocation evidence records the sandbox execution profile for the\nbuilt-in client. Injected test clients record no sandbox profile.\n\n## Sprint history and next delivery path'''
          replace_once("docs/CONTEXT.md", context_anchor, context_insert)

          prd_anchor = '''These deferred capabilities remain approved under the target architecture. A later implementation requires a new explicit ruling and the applicable ADR-002 admission evidence. No authority-document update can be interpreted as authorization to expand P4 beyond this scope.\n\n## Problem'''
          prd_insert = '''These deferred capabilities remain approved under the target architecture. A later implementation requires a new explicit ruling and the applicable ADR-002 admission evidence. No authority-document update can be interpreted as authorization to expand P4 beyond this scope.\n\n#### Current production sandbox requirement\n\nEvery enabled production model invocation uses the admitted sandbox execution\nprofile. The current Anthropic profile is\n`vercel-sandbox-anthropic-egress-v1`.\n\nThe Vercel Sandbox isolates the local provider request and response relay and the\nprovider egress surface. Anthropic hosts the remote inference process. The product\ndoes not claim that hosted Anthropic inference runs inside the local microVM.\n\nThe current sandbox is ephemeral, receives no host environment, exposes no\nports, and permits only the exact Anthropic Messages API egress. The real\nprovider credential stays outside the VM and is injected only at the trusted\nnetwork-policy boundary. There is no direct-host provider fallback. Sandbox\nfailure uses only the deterministic template fallback or hold.\n\nThe durable model-invocation start evidence records the non-secret execution\nprofile identity for the built-in production model client. This requirement does\nnot authorize model-selected actions, general tool use, subagents, routing,\nvoting, or another deferred Position B capability.\n\n## Problem'''
          replace_once("docs/PRD.md", prd_anchor, prd_insert)

          model_anchor = '''These structures describe the target architecture. Current P4 does not implement model-selected WHAT, a capability resolver, tools, workflows, or workers.\n\n## 3. Authority matrix'''
          model_insert = '''These structures describe the target architecture. Current P4 does not implement model-selected WHAT, a capability resolver, tools, workflows, or workers.\n\n### 2.2 Current production execution isolation\n\nThe provider-neutral `RuntimeModelClient` remains the application model boundary.\nThe current production registry resolves Anthropic only through the admitted\n`vercel-sandbox-anthropic-egress-v1` execution profile. The official Anthropic\nSDK remains the provider protocol adapter. Its HTTP transport runs through the\nsandbox relay rather than through a direct host fetch.\n\nThe current Vercel Sandbox profile is non-persistent, has no exposed ports,\nreceives no host environment, and permits only `POST /v1/messages` to\n`api.anthropic.com`. The provider credential is replaced with a placeholder before\nthe request enters the VM. The trusted Vercel network-policy boundary injects\nthe real credential only for the exact admitted egress.\n\nThis profile isolates the local request and response relay and provider egress.\nAnthropic hosts the inference process, so this specification does not describe\nremote Anthropic inference as executing inside the Vercel microVM.\n\nThe sandbox path does not add provider routing or model authority. Sandbox failure\nfails closed into the existing deterministic fallback or hold path. Durable\npre-invocation evidence records the execution profile identity for the built-in\nproduction client.\n\n## 3. Authority matrix'''
          replace_once("docs/MODEL_ADAPTER_VARIANCE_CONTROL_SPEC_V1.md", model_anchor, model_insert)

          manifest_anchor = '''  target_architecture_does_not_expand_current_scope: true\n\np4:'''
          manifest_insert = '''  target_architecture_does_not_expand_current_scope: true\n  probabilistic_execution:\n    sandbox_required_when_model_enabled: true\n    execution_profile_id: vercel-sandbox-anthropic-egress-v1\n    local_isolation_scope:\n      - provider_request_relay\n      - provider_response_relay\n      - provider_egress\n    hosted_provider_inference_runs_inside_local_sandbox: false\n    persistent: false\n    exposed_ports: []\n    host_environment_exposed: false\n    real_provider_credential_inside_vm: false\n    egress_domain: api.anthropic.com\n    egress_method: POST\n    egress_path: /v1/messages\n    direct_host_provider_fallback: false\n    failure_path: deterministic_template_fallback_or_hold\n\np4:'''
          replace_once("prd_manifest.yaml", manifest_anchor, manifest_insert)

          evidence_anchor = '''    - provider_identity\n    - effective_model_configuration'''
          evidence_insert = '''    - provider_identity\n    - execution_profile_id\n    - effective_model_configuration'''
          replace_once("prd_manifest.yaml", evidence_anchor, evidence_insert)

          implementation_anchor = '''  bounded_single_call_runtime_drafting: shipped\n  production_ingestion_commit_spine: shipped'''
          implementation_insert = '''  bounded_single_call_runtime_drafting: shipped\n  sandboxed_probabilistic_execution_boundary: shipped\n  production_ingestion_commit_spine: shipped'''
          replace_once("prd_manifest.yaml", implementation_anchor, implementation_insert)

      - name: Verify documentation patch
        shell: bash
        run: |
          git diff --check -- \
            AGENTS.md \
            docs/ARCHITECTURE.md \
            docs/CONTEXT.md \
            docs/PRD.md \
            docs/MODEL_ADAPTER_VARIANCE_CONTROL_SPEC_V1.md \
            prd_manifest.yaml
          git diff --name-only

      - name: Commit documentation and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/pr2-sync-sandbox-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md \
            docs/ARCHITECTURE.md \
            docs/CONTEXT.md \
            docs/PRD.md \
            docs/MODEL_ADAPTER_VARIANCE_CONTROL_SPEC_V1.md \
            prd_manifest.yaml \
            .github/workflows/pr2-sync-sandbox-docs.yml
          git commit -m "docs: record PR2 sandbox execution boundary"
          git push origin HEAD:pr2/vercel-sandbox-runtime-isolation
