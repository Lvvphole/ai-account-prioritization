name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security & Observability Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Gate 1: inspect the committed workflow tree before repository-controlled
      # install, generation, build, or verification code can modify the checkout.
      - name: Audit GitHub Actions workflows before repository code
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 2: no committed secrets (Rule #30).
      - name: Secret scan
        run: pnpm scan:secrets

      - name: Generate schemas
        run: pnpm generate:schemas

      # Build so the security/observability verifiers can resolve workspace dist.
      - name: Build
        run: pnpm build

      # Gate 3: root-executable workflow audit, RBAC, approval policy, and PII controls.
      - name: Verify security controls
        run: pnpm verify:security

      # Gate 4: Prisma stays excluded (Execution Rule #28).
      - name: Check no Prisma
        run: pnpm check:no-prisma

      # Gate 5: PII-safe in-product observability package.
      - name: Verify observability package
        run: pnpm verify:observability
